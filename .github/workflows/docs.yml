# Build the documentation and publish it to GitHub Pages.
#
# Runs on every push to main (and on demand from the Actions tab). Pull
# requests are built, with warnings as errors, but not published.
#
# One-off set-up: Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # publish the site
  id-token: write    # required by actions/deploy-pages

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/MR_AHA: the library the API reference is generated
          # from. Its own submodules (FINUFFT, VkFFT, mlx-nufft) are not
          # needed, so the checkout is not recursive.
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      - name: Install Sphinx and its extensions
        run: pip install -r requirements.txt
      - name: Build (warnings are errors)
        run: sphinx-build -b html -W --keep-going source _build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
